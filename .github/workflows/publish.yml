name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'roie/xyle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate the release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck:functions
      - run: pnpm test:package
      - name: Pack the package
        run: |
          mkdir package
          pnpm pack --pack-destination package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: package/xyle-*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: package
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish a new package version
        run: |
          PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
          if npm view "xyle@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "xyle@$PACKAGE_VERSION is already published."
            exit 0
          fi
          npm publish package/xyle-*.tgz --access public --provenance
