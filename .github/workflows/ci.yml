name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm typecheck:functions
      - run: pnpm test:coverage
      - run: ./node_modules/.bin/biome check .
      - run: pnpm build
      - run: pnpm exec playwright install chromium firefox --with-deps
      - run: pnpm exec playwright test --project=chromium --project=firefox

  # Credential-gated live Cloudflare verification; opt-in only.
  cloudflare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: cloudflare-live
    env:
      XYLE_CLOUDFLARE_PROJECT: ${{ vars.XYLE_CLOUDFLARE_PROJECT }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:functions
      - run: pnpm exec playwright install chromium --with-deps
      - name: Require live-test configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          XYLE_CLOUDFLARE_PROJECT: ${{ vars.XYLE_CLOUDFLARE_PROJECT }}
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$XYLE_CLOUDFLARE_PROJECT"
      - run: pnpm exec playwright test e2e/cloudflare.spec.ts --project=chromium
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
